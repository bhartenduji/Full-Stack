<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responsive Navbar</title>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#0f172a;
    color:white;
}

/* Navbar */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:75px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 8%;

    background:rgba(15,23,42,.9);
    backdrop-filter:blur(12px);

    border-bottom:1px solid rgba(255,255,255,.1);

    z-index:1000;
}

/* Logo */

.logo{
    font-size:30px;
    font-weight:bold;
    color:white;
}

.logo span{
    color:#38bdf8;
}

/* Menu */

nav ul{
    display:flex;
    list-style:none;
    gap:35px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    font-size:17px;
    transition:.3s;
}

nav ul li a:hover{
    color:#38bdf8;
}

/* Button */

.btn{
    padding:10px 22px;
    border-radius:30px;
    background:#38bdf8;
    color:white !important;
    transition:.3s;
}

.btn:hover{
    background:#0284c7;
}

/* Hamburger */

.menu-btn{
    display:none;
    font-size:28px;
    cursor:pointer;
}

/* Hero */

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.hero h1{
    font-size:60px;
}

.hero p{
    margin-top:20px;
    color:#cbd5e1;
}

/* Responsive */

@media(max-width:768px){

nav{
    padding:0 25px;
}

.menu-btn{
    display:block;
}

nav ul{
    position:absolute;
    top:75px;
    left:-100%;

    width:100%;
    background:#111827;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:25px;
    padding:30px 0;

    transition:.4s;
}

nav ul.active{
    left:0;
}

.hero h1{
    font-size:38px;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">
TECH<span>nova</span>
</div>

<ul id="menu">

<li><a href="#">Home</a></li>

<li><a href="#">About</a></li>

<li><a href="#">Services</a></li>

<li><a href="#">Contact</a></li>

<li>
<a href="#" class="btn">Login</a>
</li>

</ul>

<div class="menu-btn" id="menuBtn">
<i class="fas fa-bars"></i>
</div>

</nav>
</body>
</html>
