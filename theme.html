<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body:has(input:checked) {
            background-color: black;
            
        }
        label {
            font-size: 24px;
        }
        input:checked-label {
            color: green;
        }
    </style>
</head>
<body>
    <input type="checkbox" id="toggle">
    <label for="toggle">Toggle</label>
    
</body>
</html>
