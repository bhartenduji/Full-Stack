<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container{
            outline: 2px solid black;
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            justify-content: space-evenly;

        }
        .container>div{
            background-color: black;
            color: white;
            width: 100px;
            height: 100px;
            align-content: center;
            text-align: center;
        }
        #box1{
            background-color:  rgb(213, 25, 12);
            flex: 2 0 150px
        }
        #box2{
            background-color: rgb(47, 0, 255);
            flex: 1 0 150px;
        }
        #box3{
            background-color: rgb(40, 139, 131);
            flex: 1 0 150px;
        }
        #box4{
            background-color: rgb(14, 5, 5);
            flex: 2 0 150px;
        }
        #box5{
            background-color: rgb(0, 255, 55);
            flex: 1 0 150px;
        }
        #box6{
            background-color: rgb(0, 255, 208);
            flex: 1 0 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>

    </div>
</body>
</html>
