<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    overflow-x: auto;
    overflow-y: hidden;
}

/* Horizontal container */
.container {
    display: flex;
    width: max-content;
}

/* Each card */
.card {
    width: 100vw;
    height: 100vh;

    flex-shrink: 0;

    position: relative;

    display: flex;
    align-items: flex-end;

    padding: 70px;

    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;

    overflow: hidden;
}

/* Dark overlay */
.card::before {
    content: "";
    position: absolute;
    inset: 0;

    background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.85),
        rgba(0, 0, 0, 0.2)
    );

    z-index: 1;
}

/* Text */
.content {
    position: relative;
    z-index: 2;
}

.kingdom-number {
    color: #d4af37;
    font-size: 18px;
    letter-spacing: 7px;
    margin-bottom: 15px;
}

.card h1 {
    color: white;
    font-size: 80px;
    text-transform: uppercase;
    letter-spacing: 5px;
    margin-bottom: 15px;
}

.card p {
    color: #ddd;
    font-size: 24px;
    letter-spacing: 3px;
}


/* =========================
   IMAGES
========================= */

}
    </style>
</head>
<body>
