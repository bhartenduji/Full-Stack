<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .login-container{
            width:350px;
            background:#fff;
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .login-container h2{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            color:#555;
            font-weight:bold;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            outline:none;
        }

        .input-box input:focus{
            border-color:#4facfe;
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            font-size:14px;
            margin-bottom:20px;
        }

        .options a{
            text-decoration:none;
            color:#4facfe;
        }

        .login-btn{
            width:100%;
            padding:12px;
            background:#4facfe;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        .login-btn:hover{
            background:#008cff;
        }

        .signup{
            text-align:center;
            margin-top:20px;
        }

        .signup a{
            color:#4facfe;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>
<body>

    <div class="login-container">

        <h2>Login</h2>

        <form>

            <div class="input-box">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button class="login-btn">Login</button>

            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>

        </form>

    </div>

</body>
</html>
