<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h1{
            text-align: center;
            margin: 20px 0;
        }
        input[type="text"]{
            border: 2px solid blue;
            padding: 5px;
            margin: 10px;
            border-radius: 10px;
        }
        input[type="password"]{
            border: 4px solid black;
            padding: 5px;
            margin: 10px;
            border-radius: 5px;
        }
        p[data="mydata"]{
            color: red;
            font-size: 20px;
            background-color: yellow;
        }
        #id{
            color: green;
            font-size: 20px;
            background-color: pink;
        }
        .class{
            color: blue;
            font-size: 20px;
            background-color: orange;
        }
        section h2{
            color: purple;
            font-size: 20px;
            background-color: lightgray;
        }
        section>h1{
            color: purple;
            font-size: 20px;
            background-color: lightgray;
        }
        section p{
            color: brown;
            font-size: 20px;
            background-color: lightblue;
        }
        h2+p{
            color: black;
            font-size: 20px;
            background-color: lightgreen;
        }
        button:hover{
            background-color: lightblue;
            color: white;
            cursor: pointer;
        }
        button:active{
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Selectors</h1>
    <p data="mydata">universal</p>
    <p>element</p>
    <p class="class">class</p>
    <p id="id">id</p>
    <p>combinators</p>
    <p>pseudo-class</p>
    <input type="text" placeholder="text">
    <input type="password" placeholder="password">
    <section>
        <h1>Section Title</h1>
    <h2>About Us</h2>
    <p>We are a team of passionate developers.</p>
    <p>We build AI-powered applications.</p>
</section>
<button>Click Me</button>

</body>
</html>
