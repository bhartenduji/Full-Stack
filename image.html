<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cover</title>

    <style>
        .container {
            width: 500px;
            height: 500px;
            background-color: black;
            border: 10px solid white;
        }

        .container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #div2 {
            background-image: url('https://picsum.photos/id/12/200/300');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body>

    <div class="container" id="div1">
        <img src="https://picsum.photos/id/12/200/300" alt="Sample Image">
    </div>
    <div class="container" id="div2"></div>

</body>
</html>
