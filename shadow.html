<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Text Properties</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    h1 {
      color: blue;
      text-align: center;
      text-shadow: 2px 2px 4px gray;
    }

    .color { color: red; }
    .align { text-align: right; }
    .decoration { text-decoration: underline; }
    .transform { text-transform: uppercase; }
    .spacing { letter-spacing: 3px; word-spacing: 10px; }
    .indent { text-indent: 40px; line-height: 1.8; }
  </style>
</head>
<body>
  <h1>CSS Text Properties</h1>
  <p class="color">This text uses the color property.</p>
  <p class="align">This text is aligned to the right.</p>
  <p class="decoration">This text is underlined.</p>
  <p class="transform">this text is uppercase.</p>
  <p class="spacing">This text has letter and word spacing.</p>
  <p class="indent">This paragraph has text indent and line height.</p>
</body>
</html>
