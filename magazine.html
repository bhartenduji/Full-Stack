
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Box</title>

    <style>

        .container {
            display: grid;

            /* 3 columns */
            grid-template-columns: 1fr 1fr 1fr;

            /* 3 rows */
            grid-template-rows: 100px 100px 100px;

            gap: 8px;

            grid-template-areas:
                "header header card1"
                "header header card2"
                "sidebar main   card3";
        }


        .box {
            background: pink;
            color: white;

            font-size: 20px;
            text-align: center;

            border: 2px solid black;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .header {
            grid-area: header;
        }

        .sidebar {
            grid-area: sidebar;
        }

        .main {
            grid-area: main;
        }

        .card1 {
            grid-area: card1;
        }

        .card2 {
            grid-area: card2;
        }

        .card3 {
            grid-area: card3;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box header">HEADER</div>

        <div class="box sidebar">SIDEBAR</div>

        <div class="box main">MAIN CONTENT</div>

        <div class="box card1">CARD 1</div>

        <div class="box card2">CARD 2</div>

        <div class="box card3">CARD 3</div>

    </div>

</body>

</html>
