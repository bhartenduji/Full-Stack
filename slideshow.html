<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seven Kingdoms</title>

    <style>

        /* =========================
           RESET
        ========================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

.container {
    width: 100%;
}

/* =========================
   COMMON CARD
========================= */

.card {
    width: 100%;
    height: 100vh;

    position: sticky;
    top: 0;

    display: flex;
    align-items: flex-end;

    padding: 70px;

    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;

    background-color: #000;

    overflow: hidden;
}

/* =========================
   DARK OVERLAY
========================= */



/* =========================
   TEXT
========================= */

.content {
    position: relative;
    z-index: 2;

    max-width: 900px;
}

.kingdom-number {
    font-size: 18px;
    letter-spacing: 7px;

    color: #d4af37;

    margin-bottom: 20px;
}

.card h1 {
    font-size: 80px;
    font-weight: 700;

    letter-spacing: 5px;

    margin-bottom: 20px;

    color: white;

    text-shadow:
        2px 3px 10px rgba(0, 0, 0, 0.9);
}

.card p {
    font-size: 25px;

    letter-spacing: 3px;

    color: #ddd;

    text-shadow:
        2px 2px 8px rgba(0, 0, 0, 0.9);
}


/* =========================
   IMAGES
========================= */

.card0 {
    background-image: url("https://tlshbnw.wordpress.com/wp-content/uploads/2014/06/targaryen_sigil.jpg?w=600");
    z-index: 0;
}
.card1 {
    background-image: url("https://tlshbnw.wordpress.com/wp-content/uploads/2014/06/stark_sigil.jpg");
    z-index: 1;
}

.card2 {
    background-image: url("https://tlshbnw.wordpress.com/wp-content/uploads/2014/06/lannister_sigil.jpg");
    z-index: 2;
}

.card3 {
    background-image: url("https://tlshbnw.wordpress.com/wp-content/uploads/2014/06/baratheon_sigil.jpg");
    z-index: 3;
}

.card4 {
    background-image: url("https://m.media-amazon.com/images/I/61YWK7JRg9L.jpg");
    z-index: 4;
}

.card5 {
    background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbJTQXzI0_dFJmtg3dkszk86iiUMlwj31-w5egJzrNzC24_NIjc86_XwU&s=10");
    z-index: 5;
}

.card6 {
    background-image: url("https://tlshbnw.wordpress.com/wp-content/uploads/2014/06/greyjoy_sigil.jpg");
    z-index: 6;
}

.card7 {
    background-image: url("https://i.pinimg.com/564x/78/ff/72/78ff72ed4bacaecba6607b621da27b1c.jpg");
    z-index: 7;
}


</style>
</head>


<body>


    <div class="container">
